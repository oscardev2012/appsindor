name: Deploy SAFE portals to Azure

on:
  push:
    branches: [main]
    paths:
      - "RealtorSiteCore/SafeManagement.Data/**"
      - "RealtorSiteCore/SafeManagement.FieldTeam/**"
      - "RealtorSiteCore/SafeManagement.Operations/**"
      - "RealtorSiteCore/SafeManagement.Realtor/**"
      - ".github/workflows/deploy-safe-portals.yml"
  pull_request:
    branches: [main]
    paths:
      - "RealtorSiteCore/SafeManagement.Data/**"
      - "RealtorSiteCore/SafeManagement.FieldTeam/**"
      - "RealtorSiteCore/SafeManagement.Operations/**"
      - "RealtorSiteCore/SafeManagement.Realtor/**"
      - ".github/workflows/deploy-safe-portals.yml"
  workflow_dispatch:

concurrency:
  group: deploy-safe-portals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    name: ${{ matrix.app-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: SafeManagement.FieldTeam
            app-name: safemanagmentcore
            secret: AZURE_PUBLISH_PROFILE_SAFEMANAGMENTCORE
          - project: SafeManagement.Operations
            app-name: safemanagmentoperation
            secret: AZURE_PUBLISH_PROFILE_SAFEMANAGMENTOPERATION
          - project: SafeManagement.Realtor
            app-name: safeecosystem
            secret: AZURE_PUBLISH_PROFILE_SAFEECOSYSTEM

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish "RealtorSiteCore/${{ matrix.project }}/${{ matrix.project }}.csproj" -c Release -o "${{ runner.temp }}/publish"

      - name: Deploy to Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.app-name }}
          publish-profile: ${{ secrets[matrix.secret] }}
          package: ${{ runner.temp }}/publish
